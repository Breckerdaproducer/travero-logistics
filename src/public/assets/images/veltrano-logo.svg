<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" fill="none">
  <defs>
    <linearGradient id="traGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="traGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="traGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="traGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Modern Dynamic 'T' Kinetic Orange Crest for Travero -->
  <g transform="translate(6, 6)" filter="url(#traGlow)">
    <!-- Vertical Stem of 'T' (Deep Amber-Orange Foundation) -->
    <path d="M26 20 L40 20 L30 50 L16 50 Z" fill="url(#traGrad2)"/>
    <!-- Left Wing of 'T' Crossbar -->
    <path d="M8 12 L34 12 L28 23 L14 23 Z" fill="url(#traGrad1)"/>
    <!-- Right Fast Ascending Wing of 'T' Crossbar -->
    <path d="M32 12 L58 12 L52 23 L31 23 Z" fill="url(#traGrad3)"/>
    <!-- Central Aerodynamic Winglet at 'T' Junction -->
    <path d="M22 21 L43 21 L35 34 L21 34 Z" fill="url(#traGrad1)"/>
    <!-- Forward Speed Accent Dart -->
    <path d="M27 24 L37 24 L32 30 L25 30 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Typography -->
  <text x="78" y="38" font-family="'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="1.5" fill="#0f172a">TRAVERO</text>
  <text x="80" y="54" font-family="'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="11.5" letter-spacing="6" fill="#ea580c">LOGISTICS</text>
</svg>